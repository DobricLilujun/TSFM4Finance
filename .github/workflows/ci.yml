name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install tsfm_eval + tsfm4finance + dev deps
        run: uv pip install -e src/tsfm_eval -e . --system

      - name: Install test deps
        run: uv pip install pytest httpx2 --system

      - name: Run tests
        run: pytest tests/ -q

      - name: Build datasets (smoke test)
        run: python scripts/build_datasets.py
        continue-on-error: true

      - name: Build deploy bundle
        run: python scripts/make_deploy.py
        continue-on-error: true
