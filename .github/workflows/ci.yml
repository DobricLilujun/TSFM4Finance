name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install tsfm_eval + tsfm4finance
        run: uv pip install -e src/tsfm_eval -e . --system

      - name: Run tests
        run: uv run --system pytest tests/ -q

      - name: Build datasets (smoke test)
        run: uv run --system python scripts/build_datasets.py

      - name: Build deploy bundle
        run: uv run --system python scripts/make_deploy.py

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: assets/outputs/deploy/index.html
