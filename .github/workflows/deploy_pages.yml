name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install packages
        run: uv pip install -e src/tsfm_eval -e . --system

      - name: Build deploy bundle
        run: python scripts/make_deploy.py

      - name: Push to gh-pages
        run: |
          cp assets/outputs/deploy/index.html /tmp/deploy_index.html
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/deploy_index.html index.html
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes for gh-pages."
          else
            git commit -m "chore: update gh-pages deploy bundle [skip ci]"
            git push "https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          fi
