name: Refresh datasets and leaderboard

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install packages
        run: uv pip install -e src/tsfm_eval -e . --system

      - name: Build datasets
        run: python scripts/build_datasets.py

      - name: Refresh leaderboard
        run: python scripts/refresh_leaderboard.py

      - name: Build deploy bundle
        run: python scripts/make_deploy.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data assets/leaderboard assets/outputs/deploy
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh datasets, leaderboard and deploy bundle [skip ci]"
            git push "https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi

      - name: Update gh-pages branch
        run: |
          cp assets/outputs/deploy/index.html /tmp/deploy_index.html
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/deploy_index.html index.html
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes for gh-pages."
          else
            git commit -m "chore: update gh-pages deploy bundle [skip ci]"
            git push "https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          fi
