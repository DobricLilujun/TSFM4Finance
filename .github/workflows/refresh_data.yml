name: Refresh datasets and leaderboard

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install packages
        run: uv pip install -e src/tsfm_eval -e . --system

      - name: Build datasets
        run: uv run --system python scripts/build_datasets.py

      - name: Refresh leaderboard
        run: uv run --system python scripts/refresh_leaderboard.py

      - name: Build deploy bundle
        run: uv run --system python scripts/make_deploy.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data assets/leaderboard assets/outputs/deploy
          git diff --staged --quiet || (git commit -m "chore: refresh datasets, leaderboard and deploy bundle" && git push)
