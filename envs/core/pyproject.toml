[project]
name = "tsfm4finance-core"
version = "0.1.0"
description = "Arena benchmark environment for the core model family. sweep driver + TimesFM 3.0 + Chronos + baselines."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.22.1",
    "timesfm==3.0.2",
    "chronos-forecasting==2.3.2",
    "granite-tsfm==0.3.12",
    "datasets==2.17.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==26.0.1",
    "statsmodels==0.15.0",
    "pmdarima==2.1.1",
    "scikit-learn==1.7.2",
    "scipy==1.17.1",
    "pytest>=8",
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
    "tqdm>=4.66",
    "pytest>=8",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
