[project]
name = "tsfm4finance-moirai"
version = "0.1.0"
description = "Arena benchmark environment for the moirai model family. uni2ts pins torch<2.5."
requires-python = ">=3.11"
dependencies = [
    "torch==2.4.1",
    "triton==3.0.0",
    "uni2ts==2.0.0",
    "gluonts==0.14.4",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pyarrow==16.1.0",
    "datasets==2.17.1",
    "einops==0.7.0",
    "torchmetrics==1.9.0",
    "scipy==1.11.4",
    "huggingface-hub<1.0",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
