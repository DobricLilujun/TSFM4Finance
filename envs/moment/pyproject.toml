[project]
name = "tsfm4finance-moment"
version = "0.1.0"
description = "Arena benchmark environment for the moment model family. momentfm hard-pins huggingface-hub==0.24.0, so this env must not pin hub or the numpy/pandas versions momentfm pulls (pinning hub==0.36.2 makes the environment unsatisfiable); hub must stay <1.0 for its remote code."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.3.1",
    "triton==2.3.1",
    "momentfm==0.1.4",
    "transformers==4.33.3",
    "numpy>=1.25,<2",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "datasets>=2.16,<3",
    "scipy>=1.11",
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
    "tqdm>=4.66",
    "pytest>=8",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
