[project]
name = "tsfm4finance-moment"
version = "0.1.0"
description = "Arena benchmark environment for the moment model family. momentfm pins numpy==1.25.2; hub must stay <1.0."
requires-python = ">=3.11"
dependencies = [
    "torch==2.3.1",
    "triton==2.3.1",
    "momentfm==0.1.4",
    "transformers==4.33.3",
    "huggingface-hub==0.36.2",
    "numpy==1.25.2",
    "pandas==2.1.4",
    "pyarrow==15.0.2",
    "datasets==2.16.1",
    "scipy==1.16.3",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
