[project]
name = "tsfm4finance-timemoe"
version = "0.1.0"
description = "Arena benchmark environment for the timemoe model family. Time-MoE remote code needs transformers==4.44 (fails on 4.46+/5.x)."
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1",
    "triton==3.1.0",
    "transformers==4.44.2",
    "huggingface-hub==0.36.2",
    "datasets==5.0.1",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
