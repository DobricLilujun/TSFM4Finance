[project]
name = "tsfm4finance-tirex"
version = "0.1.0"
description = "Arena benchmark environment for the tirex model family. TiRex v1."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.15.0",
    "tirex-ts==1.4.2",
    "datasets==5.1.0",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
    "tqdm>=4.66",
    "pytest>=8",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
