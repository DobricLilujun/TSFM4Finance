[project]
name = "tsfm4finance-ttm"
version = "0.1.0"
description = "Arena benchmark environment for the ttm model family. Granite TTM r2 + FlowState r1 (tsfm_public)."
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0",
    "transformers==5.22.1",
    "granite-tsfm==0.3.12",
    "datasets==5.1.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "einops==0.8.2",
    "statsmodels==0.15.0",
]

[tool.uv]
# library-style env: uv must not try to build/install this project itself
package = false
