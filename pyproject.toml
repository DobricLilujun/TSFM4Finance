[project]
name = "tsfm4finance"
version = "0.1.0"
description = "Finance TSFMs Arena - a unified benchmark/leaderboard for financial time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "yfinance>=0.4",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
models = [
    "timesfm>=1.0",
    "chronos-forecasting>=1.0",
    "pmdarima>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.uv.sources]
tsfm-eval = { path = "src/tsfm_eval" }

[tool.uv]
package = true

[tool.setuptools]
packages = ["tsfm4finance"]

[tool.setuptools.package-data]
tsfm4finance = ["web/static/**/*"]
