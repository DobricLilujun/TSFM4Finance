[project]
name = "tsfm-trl"
version = "0.1.0"
description = "TRL for Time Series Foundation Models: one API to load, fine-tune (forecast + classification) and reward-tune every open TSFM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TSFM TRL authors" }]
keywords = ["time-series", "foundation-models", "fine-tuning", "forecasting", "classification"]

# Core stays deliberately small: the library must import (and its tests must run)
# without a single foundation model installed.  Model stacks live in the extras.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU/torch is only needed for training and for the neural adapters.
torch = ["torch>=2.1"]
rl = ["torch>=2.1"]

# ---- model families (each is a separate dependency island; see docs/01_install.md)
timesfm = ["timesfm>=2.0"]
chronos = ["chronos-forecasting>=2.0"]
moirai = ["uni2ts"]
moment = ["momentfm"]
granite = ["granite-tsfm"]
toto = ["toto-2"]
tirex = ["tirex-ts"]
tirex2 = ["tirex-2"]
timemoe = ["transformers"]
sundial = ["transformers"]
kronos = ["kronos"]
kairos = ["transformers"]
timestral = ["numpy"]
hirondel = ["hirondel"]
t0 = ["tfc-t0"]
yug = ["yug"]
aurora = ["transformers"]
visionts = ["einops"]

baselines = ["statsmodels>=0.14", "pmdarima>=2.0"]
dev = ["pytest>=8", "pytest-timeout"]
all = [
    "torch>=2.1", "timesfm>=2.0", "chronos-forecasting>=2.0", "momentfm",
    "granite-tsfm", "transformers", "kronos", "statsmodels>=0.14", "pmdarima>=2.0",
]

[project.scripts]
tsfm-trl = "tsfm_trl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tsfm_trl", "tsfm_trl.data", "tsfm_trl.model", "tsfm_trl.model.adapters",
            "tsfm_trl.training", "tsfm_trl.probing", "tsfm_trl.eval"]

[tool.setuptools.package-data]
tsfm_trl = ["models.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model weights and/or a GPU (deselected by default)",
    "gpu: needs a CUDA device",
]
addopts = "-m 'not slow and not gpu'"
